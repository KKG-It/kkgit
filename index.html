<!DOCTYPE html>
<html lang="no">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>KKG-IT | Hjem</title>
        <meta name="description" content="KKG-IT er samlesiden for alt du trenger som elev - passord, skoleplattformer og dokumenter.">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
        <link href="style/styles.css" rel="stylesheet" type="text/css">
    </head>
    <body>
        <header class="site-header">
            <div class="brand">
                <img class="brand-logo" src="img/logo.png" alt="Kristiansand katedralskole Gimle" href="https://kkgit.no">
            </div>
            <p class="header-note">Denne siden er under utvikling</p>
        </header>

        <section class="hero">
            <div class="hero__shapes" aria-hidden="true"></div>
            <div class="hero__content">
                <h1>Velkommen til KKG-IT</h1>
                <p>Her finner du alt du trenger - fra å tilbakestille passord til å logge inn på skoleplattformer og lese dokumenter om det som skjer hos oss.</p>
                <label class="hero__search" for="hub-search">
                    <span class="visually-hidden">Søk i snarveier</span>
                    <input type="search" id="hub-search" placeholder="Hva leter du etter?">
                </label>
            </div>
        </section>

        <main id="hub-grid" class="hub-grid" aria-live="polite">
            <!-- Kortene bygges automatisk fra hubLinks i js/script.js -->
        </main>

        <footer class="site-footer">
            <p>Finner du ikke det du leter etter? Ta kontakt med IT-support.</p>
            <p class="site-footer__small">KKG-IT &middot; Denne siden er under utvikling</p>
        </footer>

        <script src="js/script.js" defer></script>
    </body>
</html>
